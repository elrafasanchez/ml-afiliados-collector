# Sincronización autónoma de las métricas de Afiliados de Mercado Libre.
#
# Este archivo es el planificador del sistema: corre en la infraestructura de
# GitHub, no en la computadora de nadie. Es lo que permite apagar la Mac y que
# el tablero siga actualizándose.
#
# Los horarios están en UTC. Hermosillo es UTC-7 todo el año.
name: Sincronizar Mercado Libre

on:
  schedule:
    # Día en curso, mes vigente y detalle transaccional: cada 30 minutos.
    # El minuto 7/37 evita el pico de trabajos que todo el mundo programa en
    # punto y a la media, donde GitHub acumula más retraso.
    - cron: '7,37 * * * *'
    # Relectura de la última semana, para capturar revisiones de la fuente.
    - cron: '23 */6 * * *'
    # Auditoría completa de 180 días y reconciliación, una vez por semana.
    - cron: '41 9 * * 1'
  workflow_dispatch:
    inputs:
      job:
        description: 'Trabajo a ejecutar'
        required: true
        default: 'today'
        type: choice
        options: [today, recent, backfill, audit]
      start:
        description: 'Inicio inclusivo YYYY-MM-DD (solo backfill/audit)'
        required: false
        type: string
      end:
        description: 'Fin exclusivo YYYY-MM-DD (solo backfill/audit)'
        required: false
        type: string

# Dos ejecuciones simultáneas leerían la misma fuente y publicarían el mismo
# día. La ingesta es idempotente, así que no corrompería nada, pero es trabajo
# desperdiciado contra un servicio de terceros.
concurrency:
  group: mercadolibre-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Elegir el trabajo según el disparador
        id: plan
        # Las entradas viajan por el entorno, no interpoladas en el guion.
        # `${{ }}` sustituye texto antes de que exista el shell, así que un
        # valor con comillas o punto y coma se ejecutaría como comando.
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_JOB: ${{ inputs.job }}
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            job="$IN_JOB"
            start="$IN_START"
            end="$IN_END"
            days=""
          else
            start=""; end=""; days=""
            case "$SCHEDULE" in
              '23 */6 * * *') job="recent"; days="7" ;;
              '41 9 * * 1')   job="audit" ;;
              *)              job="today" ;;
            esac
          fi

          # Las fechas se comprueban aquí y no más adelante: un rango mal
          # escrito debe detener el trabajo antes de tocar la fuente.
          #
          # No basta con la forma: `2026-13-45` tiene cuatro-dos-dos dígitos y
          # no existe. Se contrasta contra `date`, que reconstruye la fecha y
          # devuelve algo distinto de lo escrito si el mes o el día no existen.
          for value in "$start" "$end"; do
            [ -n "$value" ] || continue
            if ! printf '%s' "$value" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "::error::La fecha '$value' no tiene el formato YYYY-MM-DD."
              exit 1
            fi
            if [ "$(date -d "$value" +%Y-%m-%d 2>/dev/null)" != "$value" ]; then
              echo "::error::La fecha '$value' no existe en el calendario."
              exit 1
            fi
          done
          case "$job" in
            today|recent|backfill|audit) ;;
            *) echo "::error::Trabajo desconocido: '$job'."; exit 1 ;;
          esac

          {
            echo "job=$job"
            echo "start=$start"
            echo "end=$end"
            echo "days=$days"
          } >> "$GITHUB_OUTPUT"

      - name: Pruebas del recolector
        # Si la lógica está rota, es preferible no publicar nada que publicar
        # datos mal interpretados.
        run: python3 -m unittest discover -s tests -t . -q

      - name: Sincronizar
        id: run
        env:
          ML_SESSION_COOKIE: ${{ secrets.ML_SESSION_COOKIE }}
          ML_INGEST_URL: ${{ secrets.ML_INGEST_URL }}
          ML_INGEST_TOKEN: ${{ secrets.ML_INGEST_TOKEN }}
          JOB: ${{ steps.plan.outputs.job }}
          START: ${{ steps.plan.outputs.start }}
          END: ${{ steps.plan.outputs.end }}
          DAYS: ${{ steps.plan.outputs.days }}
        run: |
          argumentos=()
          [ -n "$START" ] && argumentos+=(--start "$START")
          [ -n "$END" ] && argumentos+=(--end "$END")
          [ -n "$DAYS" ] && argumentos+=(--days "$DAYS")

          set +e
          python3 run_sync.py "$JOB" "${argumentos[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Avisar que la sesión de Mercado Libre caducó
        # El código 2 es el único fallo que una persona tiene que resolver a
        # mano. Se abre un aviso en lugar de dejarlo enterrado en los registros.
        if: failure() && steps.run.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # El texto se arma con printf en vez de escribirlo en varias líneas
          # dentro de las comillas: una línea sin sangrar cerraría el bloque
          # literal de YAML y GitHub ya no podría leer el archivo.
          cuerpo=$(printf '%s\n' \
            "El recolector no pudo autenticarse contra Mercado Libre." \
            "" \
            "El tablero conserva el último dato válido y lo muestra marcado como rezagado; no se escribió ningún cero." \
            "" \
            "Para restablecerlo actualiza el secreto ML_SESSION_COOKIE siguiendo docs/renovar-sesion.md, y vuelve a lanzar el trabajo today desde la pestaña Actions.")

          existing=$(gh issue list --state open --label sesion-caducada --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh issue create \
              --title "La sesión de Mercado Libre caducó" \
              --label sesion-caducada \
              --body "$cuerpo"
          else
            gh issue comment "$existing" \
              --body "La sesión seguía caducada el $(date -u '+%Y-%m-%d %H:%M UTC')."
          fi
